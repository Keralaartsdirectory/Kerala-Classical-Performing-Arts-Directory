<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kerala Classical & Traditional Performing Arts Directory — Enroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F0E1;
    --card: #FFFDF7;
    --ink: #2A2320;
    --maroon: #7A1F2B;
    --maroon-dark: #591420;
    --gold: #B8862E;
    --gold-light: #E8D2A0;
    --green: #2F4A3C;
    --line: #E3D6BC;
    --danger: #7A1F2B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 0% 0%, rgba(122,31,43,0.05), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(47,74,60,0.06), transparent 40%);
    color:var(--ink);
    font-family:'Hind', sans-serif;
    font-size:18px;
    line-height:1.5;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .topbar{
    background:linear-gradient(180deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    color:#F7F0E1;
    padding:22px 20px 26px;
    text-align:center;
    position:relative;
  }
  .topbar h1{
    font-family:'Rozha One', serif;
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:0.3px;
    font-weight:400;
  }
  .topbar p{
    margin:0;
    font-size:14px;
    color:var(--gold-light);
    letter-spacing:0.5px;
  }
  .motif{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:12px;
  }
  .motif span{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold);
    opacity:0.85;
  }
  .motif span:nth-child(3n){ background:#F7F0E1; opacity:0.5; }

  .wrap{ max-width:560px; margin:0 auto; padding:20px 16px 0; }

  .progress{
    display:flex; align-items:center; gap:4px;
    margin:18px 0 22px;
  }
  .progress .seg{
    flex:1; height:6px; border-radius:4px;
    background:var(--line);
    overflow:hidden;
  }
  .progress .seg.done{ background:var(--gold); }
  .progress .seg.active{ background:var(--maroon); }
  .step-label{
    text-align:center; font-size:13px; color:var(--green);
    text-transform:uppercase; letter-spacing:1.5px; font-weight:600;
    margin-bottom:6px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 20px;
    box-shadow:0 2px 10px rgba(90,60,20,0.06);
  }
  .card h2{
    font-family:'Rozha One', serif;
    font-weight:400;
    font-size:22px;
    color:var(--maroon);
    margin:0 0 4px;
  }
  .card .sub{
    font-size:15px; color:#6b5d4f; margin:0 0 18px;
  }

  label.field-label{
    display:block; font-weight:600; font-size:16px; margin:16px 0 6px;
    color:var(--ink);
  }
  label.field-label .req{ color:var(--maroon); }
  label.field-label .opt{ color:#9a8c7a; font-weight:500; font-size:13px; }

  input[type=text], input[type=tel], input[type=email], textarea{
    width:100%;
    font-family:'Hind', sans-serif;
    font-size:18px;
    padding:13px 14px;
    border:2px solid var(--line);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  input:focus, textarea:focus{ border-color:var(--maroon); }
  textarea{ min-height:80px; resize:vertical; }

  .check-row{ display:flex; align-items:center; gap:10px; margin:14px 0; }
  .check-row input[type=checkbox]{ width:22px; height:22px; accent-color:var(--maroon); }
  .check-row label{ font-size:16px; font-weight:500; }

  .conditional{
    margin-top:10px; padding:12px 14px;
    background:#FBF3E4; border-left:3px solid var(--gold);
    border-radius:8px;
    display:none;
  }
  .conditional.show{ display:block; }

  .option-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .option-card{
    border:2px solid var(--line);
    background:#fff;
    border-radius:12px;
    padding:16px 10px;
    text-align:center;
    cursor:pointer;
    font-weight:600;
    font-size:16px;
    color:var(--ink);
    transition:all .12s;
    user-select:none;
  }
  .option-card:active{ transform:scale(0.98); }
  .option-card.selected{
    border-color:var(--maroon);
    background:linear-gradient(180deg,#fff, #FBF0EC);
    color:var(--maroon);
    box-shadow:0 2px 8px rgba(122,31,43,0.15);
  }
  .option-card .tag{ display:block; font-size:12px; color:#9a8c7a; font-weight:500; margin-top:3px; }
  .option-card.selected .tag{ color:var(--gold); }

  .chip-wrap{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .chip{
    border:2px solid var(--line);
    background:#fff;
    border-radius:999px;
    padding:9px 16px;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    user-select:none;
  }
  .chip.selected{
    border-color:var(--green);
    background:var(--green);
    color:#fff;
  }

  .nav-buttons{
    display:flex; gap:10px; margin-top:26px;
  }
  button{
    font-family:'Hind', sans-serif;
    font-size:17px;
    font-weight:600;
    border-radius:10px;
    padding:14px 18px;
    border:none;
    cursor:pointer;
  }
  .btn-primary{
    flex:1;
    background:var(--maroon);
    color:#fff;
  }
  .btn-primary:active{ background:var(--maroon-dark); }
  .btn-secondary{
    background:transparent;
    color:var(--green);
    border:2px solid var(--line);
  }
  .btn-primary:disabled{ background:#c9b7a8; cursor:not-allowed; }

  .error-text{ color:var(--danger); font-size:14px; margin-top:6px; display:none; }
  .error-text.show{ display:block; }

  .summary-row{
    display:flex; justify-content:space-between; gap:12px;
    padding:10px 0; border-bottom:1px solid var(--line);
    font-size:15px;
  }
  .summary-row .k{ color:#6b5d4f; flex:0 0 42%; }
  .summary-row .v{ font-weight:600; text-align:right; flex:1; }

  .success-icon{
    width:64px;height:64px;border-radius:50%;
    background:var(--green); color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:32px; margin:0 auto 16px;
  }
  .ref-box{
    background:#FBF3E4; border:1px dashed var(--gold);
    border-radius:10px; padding:14px; text-align:center; margin:16px 0;
  }
  .ref-box .refid{ font-family:'Rozha One', serif; font-size:20px; color:var(--maroon); letter-spacing:1px; }

  .helper-text{ font-size:13px; color:#9a8c7a; margin-top:4px; }
  .hidden{ display:none !important; }
  .mal{ display:block; font-size:14px; color:#8a7256; margin-top:2px; font-weight:500; }
  h2 .mal{ font-size:15px; margin-top:1px; }
  .option-card .mal{ font-size:12.5px; margin-top:2px; }
  .chip .mal{ font-size:12px; margin-top:1px; opacity:0.85; }

  .admin-link{
    display:block; text-align:center; margin:34px 0 0;
    font-size:13px; color:#9a8c7a; text-decoration:underline;
    cursor:pointer; background:none; border:none; font-family:'Hind',sans-serif;
    width:100%;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(42,35,32,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .modal-box{
    background:var(--card); border-radius:14px; padding:24px 20px;
    max-width:380px; width:100%; box-shadow:0 8px 30px rgba(0,0,0,0.25);
  }
  .modal-box h3{ font-family:'Rozha One',serif; font-weight:400; color:var(--maroon); margin:0 0 12px; font-size:20px; }

  .admin-wrap{ max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  .admin-header{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .admin-header h2{ font-family:'Rozha One',serif; font-weight:400; color:var(--maroon); margin:0; font-size:22px; }
  .admin-stats{ font-size:14px; color:#6b5d4f; }
  .admin-toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .admin-toolbar input[type=text]{ flex:1; min-width:160px; }
  .btn-gold{ background:var(--gold); color:#fff; white-space:nowrap; }
  .btn-outline{ background:transparent; border:2px solid var(--line); color:var(--ink); white-space:nowrap; }

  .entry-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px;
  }
  .entry-card .entry-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .entry-card .entry-name{ font-weight:700; font-size:17px; color:var(--ink); }
  .entry-card .entry-ref{ font-size:12px; color:var(--gold); font-family:'Rozha One',serif; }
  .entry-card .entry-meta{ font-size:14px; color:#6b5d4f; margin-top:4px; }
  .entry-card .entry-meta b{ color:var(--green); }
  .empty-state{ text-align:center; color:#9a8c7a; padding:40px 10px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Kerala Classical &amp; Traditional Performing Arts Directory</h1>
  <p>Stakeholder Enrollment · Agni Cultural Academy</p>
  <p style="font-size:13px;color:#F7F0E1;opacity:0.85;margin-top:2px;">കേരള ക്ലാസിക്കൽ & പരമ്പരാഗത കലാരൂപ ഡയറക്ടറി</p>
  <div class="motif">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<div class="wrap">
  <div id="stepLabel" class="step-label">Step 1 of 7</div>
  <div class="progress" id="progressBar"></div>

  <div class="card" id="cardArea"></div>

  <button class="admin-link" id="adminLinkBtn">Admin</button>
</div>

<div id="adminRoot"></div>

<script>
// ---------- Data ----------
const WHO_OPTIONS = [
  {v:"Artist", tag:"Performer", mal:"കലാകാരൻ / കലാകാരി", malTag:"അവതാരകൻ"},
  {v:"Teacher", tag:"Trainer / Guru", mal:"അധ്യാപകൻ / അധ്യാപിക", malTag:"ഗുരു"},
  {v:"Institution", tag:"School / Academy", mal:"സ്ഥാപനം", malTag:"സ്കൂൾ / അക്കാദമി"},
  {v:"Organization", tag:"Sabha / Society", mal:"സംഘടന", malTag:"സഭ"},
  {v:"Artisan", tag:"Instrument / craft", mal:"കരകൗശല വിദഗ്ധൻ", malTag:"ഉപകരണം / കരകൗശലം"},
  {v:"Sound Engineer", tag:"Sound Engineer", mal:"സൗണ്ട് എഞ്ചിനീയർ", malTag:""},
  {v:"Instrument Maker/Repairer", tag:"Maker / Repairer", mal:"ഉപകരണ നിർമ്മാതാവ്", malTag:"നന്നാക്കുന്നയാൾ"}
];

const BUCKETS = {
  "Classical & Devotional Music": {
    mal: "ശാസ്ത്രീയ & ഭക്തിസംഗീതം",
    categories: ["Carnatic Music","Hindustani Music","Sopana Sangeetham","Devotional","Bhajans"],
    specializations: ["Vocal","Violin","Veena","Mrudangam","Ghatam","Ganjira","Morsing","Tabla","Sitar","Harmonium","Flute","Nadaswaram","Thavil","Dolak","Pakhwaj"]
  },
  "Classical Dance": {
    mal: "ശാസ്ത്രീയ നൃത്തം",
    categories: ["Mohiniyattam","Bharatanatyam","Kuchipudi","Kathak","Odissi"],
    specializations: []
  },
  "Kerala Traditional Classical Art Forms": {
    mal: "കേരളത്തിന്റെ പരമ്പരാഗത കലാരൂപങ്ങൾ",
    categories: ["Kathakali","Kathakali Music","Koodiyattam","Chakiar Koothu","Nangiar Koothu","Ottamthullal","Krishnanattam","Tholppavakoothu"],
    specializations: []
  },
  "Kerala Percussion Arts": {
    mal: "കേരളത്തിന്റെ താളവാദ്യകലകൾ",
    categories: ["Thayambaka","Melam","Panchavadyam"],
    specializations: ["Chenda","Thimila","Maddalam","Kombu","Kuzhal","Edakka","Ilathalam","Mizhavu"]
  }
};
const BUCKET_ORDER = Object.keys(BUCKETS);

// ---------- State ----------
let state = {
  who: "",
  name: "", mobile: "", whatsapp: "", sameAsMobile: false,
  address: "", email: "", socialMedia: "",
  bucket: "", categories: [], specializations: [],
  air: "", awards: "", books: "",
  teachesPrivately: false, teachesPrivatelyDetails: "",
  runsPrivate: false, runsPrivateDetails: "",
  worksAt: false, worksAtDetails: "",
  orgMember: false, orgMemberDetails: "",
  consent: false
};
let step = 1;
const TOTAL_STEPS = 7;

const cardArea = document.getElementById('cardArea');
const stepLabel = document.getElementById('stepLabel');
const progressBar = document.getElementById('progressBar');

function renderProgress(){
  progressBar.innerHTML = "";
  for(let i=1;i<=TOTAL_STEPS;i++){
    const seg = document.createElement('div');
    seg.className = 'seg' + (i < step ? ' done' : i === step ? ' active' : '');
    progressBar.appendChild(seg);
  }
  stepLabel.textContent = `Step ${step} of ${TOTAL_STEPS}`;
}

function goTo(n){ step = n; render(); window.scrollTo({top:0, behavior:'smooth'}); }

function render(){
  renderProgress();
  if(step===1) renderStep1();
  else if(step===2) renderStep2();
  else if(step===3) renderStep3();
  else if(step===4) renderStep4();
  else if(step===5) renderStep5();
  else if(step===6) renderStep6();
  else if(step===7) renderStep7();
}

// ---------- Step 1: Who is enrolling ----------
function renderStep1(){
  cardArea.innerHTML = `
    <h2>Who is enrolling?<span class="mal">ആരാണ് എൻറോൾ ചെയ്യുന്നത്?</span></h2>
    <p class="sub">Choose the category that best describes you.</p>
    <div class="option-grid" id="whoGrid"></div>
    <div class="error-text" id="whoError">Please choose one option.</div>
    <div class="nav-buttons">
      <button class="btn-primary" id="nextBtn">Continue</button>
    </div>
  `;
  const grid = document.getElementById('whoGrid');
  WHO_OPTIONS.forEach(opt=>{
    const el = document.createElement('div');
    el.className = 'option-card' + (state.who===opt.v ? ' selected':'');
    el.innerHTML = `${opt.v}<span class="mal">${opt.mal}</span><span class="tag">${opt.tag}</span>`;
    el.onclick = ()=>{ state.who = opt.v; renderStep1(); };
    grid.appendChild(el);
  });
  document.getElementById('nextBtn').onclick = ()=>{
    if(!state.who){ document.getElementById('whoError').classList.add('show'); return; }
    goTo(2);
  };
}

// ---------- Step 2: Basic details ----------
function renderStep2(){
  cardArea.innerHTML = `
    <h2>Your details<span class="mal">താങ്കളുടെ വിവരങ്ങൾ</span></h2>
    <p class="sub">This helps us keep the directory accurate and lets other stakeholders reach you.</p>

    <label class="field-label">Full Name <span class="req">*</span><span class="mal">പേര്</span></label>
    <input type="text" id="fName" value="${escapeHtml(state.name)}" placeholder="e.g. Ajith Neelakantan">

    <label class="field-label">Mobile Number <span class="req">*</span><span class="mal">മൊബൈൽ</span></label>
    <input type="tel" id="fMobile" value="${escapeHtml(state.mobile)}" placeholder="10-digit mobile number">

    <div class="check-row">
      <input type="checkbox" id="fSame" ${state.sameAsMobile?'checked':''}>
      <label for="fSame">WhatsApp number is same as mobile</label>
    </div>
    <div id="waWrap" class="${state.sameAsMobile?'hidden':''}">
      <label class="field-label">WhatsApp Number <span class="req">*</span><span class="mal">വാട്സാപ്പ് നമ്പർ</span></label>
      <input type="tel" id="fWhatsapp" value="${escapeHtml(state.whatsapp)}" placeholder="10-digit WhatsApp number">
    </div>

    <label class="field-label">Postal Address <span class="req">*</span><span class="mal">വിലാസം</span></label>
    <textarea id="fAddress" placeholder="House name, Place, Post, District, PIN">${escapeHtml(state.address)}</textarea>

    <label class="field-label">Email <span class="req">*</span><span class="mal">ഇമെയിൽ</span></label>
    <input type="email" id="fEmail" value="${escapeHtml(state.email)}" placeholder="you@example.com">

    <label class="field-label">Social Media Handles <span class="opt">(optional)</span><span class="mal">സാമൂഹ്യമാധ്യമ വിലാസങ്ങൾ (ഐച്ഛികം)</span></label>
    <input type="text" id="fSocial" value="${escapeHtml(state.socialMedia)}" placeholder="Instagram / Facebook / YouTube links">

    <div class="error-text" id="step2Error">Please fill all mandatory fields correctly.</div>

    <div class="nav-buttons">
      <button class="btn-secondary" id="backBtn">Back</button>
      <button class="btn-primary" id="nextBtn">Continue</button>
    </div>
  `;
  document.getElementById('fSame').onchange = (e)=>{
    state.sameAsMobile = e.target.checked;
    document.getElementById('waWrap').classList.toggle('hidden', state.sameAsMobile);
  };
  document.getElementById('backBtn').onclick = ()=>goTo(1);
  document.getElementById('nextBtn').onclick = ()=>{
    state.name = document.getElementById('fName').value.trim();
    state.mobile = document.getElementById('fMobile').value.trim();
    state.sameAsMobile = document.getElementById('fSame').checked;
    state.whatsapp = state.sameAsMobile ? state.mobile : document.getElementById('fWhatsapp').value.trim();
    state.address = document.getElementById('fAddress').value.trim();
    state.email = document.getElementById('fEmail').value.trim();
    state.socialMedia = document.getElementById('fSocial').value.trim();

    const mobileOk = /^[0-9+\-\s]{10,14}$/.test(state.mobile);
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email);
    const waOk = /^[0-9+\-\s]{10,14}$/.test(state.whatsapp);

    if(!state.name || !mobileOk || !waOk || !state.address || !emailOk){
      document.getElementById('step2Error').classList.add('show');
      return;
    }
    goTo(3);
  };
}

// ---------- Step 3: Art form bucket ----------
function renderStep3(){
  cardArea.innerHTML = `
    <h2>Your art form<span class="mal">താങ്കളുടെ കലാരൂപം</span></h2>
    <p class="sub">Choose the area you are primarily associated with.</p>
    <div id="bucketList"></div>
    <div class="error-text" id="bucketError">Please choose one area.</div>
    <div class="nav-buttons">
      <button class="btn-secondary" id="backBtn">Back</button>
      <button class="btn-primary" id="nextBtn">Continue</button>
    </div>
  `;
  const list = document.getElementById('bucketList');
  BUCKET_ORDER.forEach(b=>{
    const el = document.createElement('div');
    el.className = 'option-card' + (state.bucket===b ? ' selected':'');
    el.style.width = '100%';
    el.style.marginBottom = '10px';
    el.style.textAlign = 'left';
    el.style.padding = '16px';
    el.innerHTML = `${b}<span class="mal">${BUCKETS[b].mal}</span>`;
    el.onclick = ()=>{
      if(state.bucket !== b){ state.categories = []; state.specializations = []; }
      state.bucket = b;
      renderStep3();
    };
    list.appendChild(el);
  });
  document.getElementById('backBtn').onclick = ()=>goTo(2);
  document.getElementById('nextBtn').onclick = ()=>{
    if(!state.bucket){ document.getElementById('bucketError').classList.add('show'); return; }
    goTo(4);
  };
}

// ---------- Step 4: Category (within bucket) ----------
function renderStep4(){
  const cats = BUCKETS[state.bucket].categories;
  cardArea.innerHTML = `
    <h2>Category<span class="mal">വിഭാഗം</span></h2>
    <p class="sub">${state.bucket} — choose all that apply.</p>
    <div class="chip-wrap" id="catWrap"></div>
    <div class="error-text" id="catError">Please choose at least one category.</div>
    <div class="nav-buttons">
      <button class="btn-secondary" id="backBtn">Back</button>
      <button class="btn-primary" id="nextBtn">Continue</button>
    </div>
  `;
  const wrap = document.getElementById('catWrap');
  cats.forEach(c=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (state.categories.includes(c) ? ' selected':'');
    chip.textContent = c;
    chip.onclick = ()=>{
      if(state.categories.includes(c)) state.categories = state.categories.filter(x=>x!==c);
      else state.categories.push(c);
      renderStep4();
    };
    wrap.appendChild(chip);
  });
  document.getElementById('backBtn').onclick = ()=>goTo(3);
  document.getElementById('nextBtn').onclick = ()=>{
    if(state.categories.length===0){ document.getElementById('catError').classList.add('show'); return; }
    // skip specialization step if bucket has none
    if(BUCKETS[state.bucket].specializations.length===0){ goTo(6); }
    else goTo(5);
  };
}

// ---------- Step 5: Specialization ----------
function renderStep5(){
  const specs = BUCKETS[state.bucket].specializations;
  cardArea.innerHTML = `
    <h2>Specialization<span class="mal">വൈദഗ്ധ്യം</span></h2>
    <p class="sub">Choose your instrument(s) or specialization — select all that apply.</p>
    <div class="chip-wrap" id="specWrap"></div>
    <div class="error-text" id="specError">Please choose at least one specialization.</div>
    <div class="nav-buttons">
      <button class="btn-secondary" id="backBtn">Back</button>
      <button class="btn-primary" id="nextBtn">Continue</button>
    </div>
  `;
  const wrap = document.getElementById('specWrap');
  specs.forEach(s=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (state.specializations.includes(s) ? ' selected':'');
    chip.textContent = s;
    chip.onclick = ()=>{
      if(state.specializations.includes(s)) state.specializations = state.specializations.filter(x=>x!==s);

      renderStep5();
    };
    wrap.appendChild(chip);
  });
  document.getElementById('backBtn').onclick = ()=>goTo(4);
  document.getElementById('nextBtn').onclick = ()=>{
    if(state.specializations.length===0){ document.getElementById('specError').classList.add('show'); return; }
    goTo(6);
  };
}

  const wire = (chkId, boxId)=>{

  wire('fWorksAt','worksAtBox');
  wire('fOrgMember','orgMemberBox');

  document.getElementById('backBtn').onclick = ()=>{
    saveStep6Fields();
    goTo(BUCKETS[state.bucket].specializations.length===0 ? 4 : 5);

function saveStep6Fields(){

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

// Live Google Apps Script Web App endpoint — writes to the "Kerala Classical
// Arts Directory" Google Sheet. Must match the ADMIN_TOKEN set in the script
// for the admin panel below to work.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoZM5vTsHZrRqsPxJikl8WBHp18ed8I9rFFGEco-RM_XJ8oV55wi7NUwPq7G4iFkiBHQ/exec";
const ADMIN_TOKEN = "agni2026"; // must match ADMIN_TOKEN in the Apps Script

async function submitForm(){
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  const refId = 'KPAD-' + Date.now().toString(36).toUpperCase().slice(-6) + Math.floor(Math.random()*90+10);
  const entry = { ...state, refId, submittedAt: new Date().toISOString() };

  let lastErr = null;
  for(let attempt=1; attempt<=3; attempt++){
    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'}, // avoids CORS preflight, which Apps Script can't handle
        body: JSON.stringify(entry)
      });
      let ok = res.ok;
      try{
        const data = await res.json();
        if(data && data.success === false){ throw new Error(data.error || 'server rejected the submission'); }
      }catch(parseErr){
        // response body unreadable is common with Apps Script even on success — don't fail on this alone
      }
      if(!ok){ throw new Error('HTTP ' + res.status); }
      renderSuccess(refId);
      return;
    }catch(err){
      lastErr = err;
      if(attempt < 3){ await sleep(600 * attempt); btn.textContent = `Retrying (${attempt+1}/3)...`; }
    }
  }

  const e = document.getElementById('submitError');
  e.style.display = 'block';
  e.textContent = 'Could not save after 3 tries (' + (lastErr && lastErr.message ? lastErr.message : 'unknown error') + '). Please check your connection and tap Submit again.';
  btn.disabled = false;
  btn.textContent = 'Submit Enrollment';
}

// Set this to the real public link once the app is hosted/published.
const ENROLLMENT_LINK = "https://kerala-arts-directory.example.com";

    <h2 style="text-align:center;">Thank you, ${escapeHtml(state.name)}!</h2>
    <p class="sub" style="text-align:center;">You have been enrolled in the Kerala Classical &amp; Traditional Performing Arts Directory.</p>
    <div class="ref-box">
      <div style="font-size:13px; color:#6b5d4f;">Your Reference ID</div>
      <div class="refid">${refId}</div>
    </div>
    <p style="font-size:15px; color:#6b5d4f; text-align:center;">Please save this reference number. Our team may contact you by phone or WhatsApp if any details need verification.</p>
    <div class="nav-buttons">
      <a href="${waLink}" target="_blank" rel="noopener" class="btn-primary" id="shareBtn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;background:#25947a;">Share with Fellow Artists on WhatsApp</a>
    </div>
    <div class="nav-buttons">
      <button class="btn-secondary" id="anotherBtn" style="width:100%;">Enroll Another Person</button>
    </div>
  `;
  document.getElementById('anotherBtn').onclick = ()=>{
    state = {
      who:"", name:"", mobile:"", whatsapp:"", sameAsMobile:false,
      address:"", email:"", socialMedia:"", bucket:"", categories:[], specializations:[],
      air:"", awards:"", books:"",
      teachesPrivately:false, teachesPrivatelyDetails:"",
      runsPrivate:false, runsPrivateDetails:"",
      worksAt:false, worksAtDetails:"",
      orgMember:false, orgMemberDetails:"",
      consent:false
    };
    goTo(1);
  };
}

function escapeHtml(str){
  if(!str) return "";
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- Admin ----------
// NOTE: this is a simple client-side gate to keep casual visitors out of the
// list, not real security — anyone who reads the page source can see the
// password. Don't rely on this alone if the data needs to stay confidential.
const ADMIN_PASSWORD = "agni2026";
let adminEntries = [];

const wrapEl = document.querySelector('.wrap');
const adminRoot = document.getElementById('adminRoot');

document.getElementById('adminLinkBtn').onclick = openAdminLogin;

function openAdminLogin(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'loginOverlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Admin Login</h3>
      <p style="font-size:14px;color:#6b5d4f;margin:0 0 14px;">Enter the admin password to view and export enrollments.</p>
      <input type="text" id="adminPwInput" placeholder="Password" style="width:100%;font-size:17px;padding:12px;border:2px solid var(--line);border-radius:10px;">
      <div class="error-text" id="pwError">Incorrect password.</div>
      <div class="nav-buttons">
        <button class="btn-secondary" id="pwCancel">Cancel</button>
        <button class="btn-primary" id="pwSubmit">Login</button>
      </div>
    </div>
  `;

  document.getElementById('pwCancel').onclick = ()=> overlay.remove();
  document.getElementById('pwSubmit').onclick = ()=>{

async function showAdminPanel(){
  wrapEl.classList.add('hidden');
  adminRoot.innerHTML = `<div class="admin-wrap"><p style="text-align:center;color:#6b5d4f;">Loading enrollments...</p></div>`;
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?token=' + encodeURIComponent(ADMIN_TOKEN));
    const data = await res.json();
    if(!data || data.success === false){ throw new Error((data && data.error) || 'Could not load'); }
    const entries = (data.entries || []).slice().sort((a,b)=> String(b.submittedAt||'').localeCompare(String(a.submittedAt||'')));
    adminEntries = entries;
    renderAdminPanel(entries);
  }catch(err){
    adminRoot.innerHTML = `<div class="admin-wrap"><p style="text-align:center;color:var(--danger);">Could not load enrollments (${escapeHtml(err.message||'')}). Please try again.</p>
      <div class="nav-buttons"><button class="btn-secondary" id="adminBackErr">Back</button></div></div>`;
    document.getElementById('adminBackErr').onclick = backToEnrollment;
  }
}

function listStr(v){ return Array.isArray(v) ? v.join(', ') : (v || ''); }

function renderAdminPanel(entries, filterText){
  filterText = (filterText||'').toLowerCase();
  const filtered = filterText ? entries.filter(e=>{
    return [e.name, e.who, e.bucket, e.mobile, e.email, listStr(e.categories), listStr(e.specializations)]
      .join(' ').toLowerCase().includes(filterText);
  }) : entries;

  adminRoot.innerHTML = `
    <div class="admin-wrap">
      <div class="admin-header">
        <h2>Enrollments</h2>
        <div class="admin-stats">${entries.length} total${filterText ? ` · ${filtered.length} shown` : ''}</div>
      </div>
      <div class="admin-toolbar">
        <input type="text" id="adminSearch" placeholder="Search by name, mobile, art form..." value="${escapeHtml(filterText)}">
        <button class="btn-gold" id="exportBtn">Export to Sheet (CSV)</button>
        <button class="btn-outline" id="refreshBtn">Refresh</button>
        <button class="btn-outline" id="logoutBtn">Log out</button>
      </div>
      <div id="entryList"></div>
    </div>
  `;
  const listEl = document.getElementById('entryList');
  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty-state">No enrollments${filterText ? ' match your search' : ' yet'}.</div>`;
  } else {
    filtered.forEach(e=>{
      const card = document.createElement('div');
      card.className = 'entry-card';
      const dateStr = e.submittedAt ? new Date(e.submittedAt).toLocaleString() : '';
      card.innerHTML = `
        <div class="entry-top">
          <span class="entry-name">${escapeHtml(e.name)}</span>
          <span class="entry-ref">${escapeHtml(e.refId||'')}</span>
        </div>
        <div class="entry-meta"><b>${escapeHtml(e.who)}</b> · ${escapeHtml(e.bucket)}</div>
        <div class="entry-meta">${escapeHtml(e.mobile)} · ${escapeHtml(e.email)}</div>
        <div class="entry-meta">${escapeHtml(listStr(e.categories))}${listStr(e.specializations) ? ' — ' + escapeHtml(listStr(e.specializations)) : ''}</div>
        <div class="entry-meta" style="font-size:12px;color:#9a8c7a;">${dateStr}</div>
      `;
      listEl.appendChild(card);
    });
  }
  document.getElementById('adminSearch').oninput = (e)=> renderAdminPanel(entries, e.target.value);
  document.getElementById('exportBtn').onclick = ()=> exportCSV(adminEntries);
  document.getElementById('refreshBtn').onclick = showAdminPanel;
  document.getElementById('logoutBtn').onclick = backToEnrollment;
}

function backToEnrollment(){
  adminRoot.innerHTML = '';
  wrapEl.classList.remove('hidden');
}

function exportCSV(entries){
  const cols = [
    ['refId','Reference ID'], ['submittedAt','Submitted At'], ['who','Enrolling As'],
    ['name','Name'], ['mobile','Mobile'], ['whatsapp','WhatsApp'], ['address','Address'],
    ['email','Email'], ['socialMedia','Social Media'], ['bucket','Art Form Bucket'], ['categories','Category'],
    ['specializations','Specialization'], ['air','AIR/DD Grade'], ['awards','Awards'],
    ['books','Books Published'],
    ['teachesPrivately','Teaches Privately'], ['teachesPrivatelyDetails','Private Teaching Details'],
    ['runsPrivate','Runs Private Institution'],
    ['runsPrivateDetails','Private Institution Details'], ['worksAt','Works At Institution'],
    ['worksAtDetails','Institution Details'], ['orgMember','Org Member/Office Bearer'],
    ['orgMemberDetails','Organization Details'], ['consent','Consent to Publish']
  ];
  const csvEsc = (v)=>{
    if(Array.isArray(v)) v = v.join('; ');
    if(v === undefined || v === null) v = '';
    if(typeof v === 'boolean') v = v ? 'Yes' : 'No';
    v = String(v).replace(/"/g,'""');
    return `"${v}"`;
  };
  let csv = cols.map(c=>csvEsc(c[1])).join(',') + '\r\n';
  entries.forEach(e=>{
    csv += cols.map(c=>csvEsc(e[c[0]])).join(',') + '\r\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kerala-arts-directory-enrollments-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
</script>
