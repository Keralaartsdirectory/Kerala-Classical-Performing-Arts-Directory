<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kerala Classical &amp; Traditional Performing Arts Directory — Enroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0A09; --card:#17140F; --card-2:#211C15;
    --ink:#F5EFE3; --muted:#B0A392;
    --maroon:#D4566B; --maroon-deep:#8C2436;
    --gold:#E5BB63; --green:#5CB08A;
    --line:#3A322A; --danger:#F0798D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Hind','Noto Sans Malayalam',sans-serif;
    font-size:19px; line-height:1.55; min-height:100vh; padding:0 0 60px 0;
    -webkit-text-size-adjust:100%;
  }
  .topbar{
    background:linear-gradient(180deg,#2A0E15 0%,#140708 100%);
    border-bottom:1px solid var(--line);
    color:var(--ink); padding:22px 20px 24px; text-align:center;
  }
  .topbar h1{font-family:'Rozha One',serif;font-size:25px;margin:0 0 5px;font-weight:400;
    line-height:1.25;color:#FBF4E6;}
  .topbar p{margin:0;font-size:14px;color:var(--gold);letter-spacing:0.5px;}
  .motif{display:flex;justify-content:center;gap:8px;margin-top:12px;}
  .motif span{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:0.9;}
  .motif span:nth-child(3n){background:var(--maroon);opacity:0.7;}

  .wrap{max-width:580px;margin:0 auto;padding:20px 16px 0;}
  .progress{display:flex;gap:4px;margin:16px 0 20px;}
  .progress .seg{flex:1;height:6px;border-radius:4px;background:#2E2820;}
  .progress .seg.done{background:var(--gold);}
  .progress .seg.active{background:var(--maroon);}
  .step-label{text-align:center;font-size:13px;color:var(--gold);text-transform:uppercase;
    letter-spacing:1.6px;font-weight:600;margin-bottom:4px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:24px 20px;box-shadow:0 4px 20px rgba(0,0,0,0.4);}
  .card h2{font-family:'Rozha One',serif;font-weight:400;font-size:24px;color:var(--gold);margin:0 0 6px;}
  .card .sub{font-size:16px;color:var(--muted);margin:0 0 20px;}

  label.field-label{display:block;font-weight:600;font-size:17px;margin:20px 0 7px;color:var(--ink);}
  label.field-label .req{color:var(--maroon);}
  label.field-label .opt{color:var(--muted);font-weight:500;font-size:14px;}

  input[type=text],input[type=tel],input[type=email],input[type=password],textarea,select{
    width:100%;font-family:'Hind','Noto Sans Malayalam',sans-serif;font-size:19px;padding:14px 15px;
    border:2px solid var(--line);border-radius:10px;background:#0E0C0A;color:var(--ink);outline:none;}
  input::placeholder,textarea::placeholder{color:#6E6355;}
  input:focus,textarea:focus,select:focus{border-color:var(--gold);}
  textarea{min-height:84px;resize:vertical;}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),
    linear-gradient(135deg,var(--gold) 50%,transparent 50%);
    background-position:calc(100% - 20px) calc(1.2em),calc(100% - 15px) calc(1.2em);
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;}

  .check-row{display:flex;align-items:flex-start;gap:12px;margin:16px 0;}
  .check-row input[type=checkbox]{width:24px;height:24px;accent-color:var(--maroon);
    flex-shrink:0;margin-top:2px;}
  .check-row label{font-size:17px;font-weight:500;}

  .conditional{margin-top:12px;padding:14px;background:var(--card-2);
    border-left:3px solid var(--gold);border-radius:8px;display:none;}
  .conditional.show{display:block;}

  .option-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:8px;}
  .option-card{border:2px solid var(--line);background:var(--card-2);border-radius:12px;
    padding:17px 11px;text-align:center;cursor:pointer;font-weight:600;font-size:17px;
    color:var(--ink);user-select:none;}
  .option-card:active{transform:scale(0.98);}
  .option-card.selected{border-color:var(--gold);background:#33261A;color:var(--gold);
    box-shadow:0 0 0 1px var(--gold) inset;}
  .option-card .tag{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:4px;}
  .option-card.selected .tag{color:#D8B478;}

  .chip-wrap{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px;}
  .chip{border:2px solid var(--line);background:var(--card-2);border-radius:999px;
    padding:10px 17px;font-size:16px;font-weight:500;cursor:pointer;user-select:none;color:var(--ink);}
  .chip.selected{border-color:var(--green);background:var(--green);color:#0B0A09;font-weight:600;}

  .nav-buttons{display:flex;gap:11px;margin-top:28px;}
  button{font-family:'Hind','Noto Sans Malayalam',sans-serif;font-size:18px;font-weight:600;
    border-radius:10px;padding:15px 18px;border:none;cursor:pointer;}
  .btn-primary{flex:1;background:var(--maroon);color:#12100E;}
  .btn-primary:active{background:#B8455A;}
  .btn-secondary{background:transparent;color:var(--gold);border:2px solid var(--line);}
  .btn-primary:disabled{background:#4A403A;color:#8A8078;cursor:not-allowed;}

  .error-text{color:var(--danger);font-size:15px;margin-top:8px;display:none;}
  .error-text.show{display:block;}

  .summary-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;
    border-bottom:1px solid var(--line);font-size:16px;}
  .summary-row .k{color:var(--muted);flex:0 0 42%;}
  .summary-row .v{font-weight:600;text-align:right;flex:1;}

  .success-icon{width:68px;height:68px;border-radius:50%;background:var(--green);color:#0B0A09;
    display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 18px;font-weight:700;}
  .ref-box{background:var(--card-2);border:1px dashed var(--gold);border-radius:10px;
    padding:16px;text-align:center;margin:18px 0;}
  .ref-box .refid{font-family:'Rozha One',serif;font-size:22px;color:var(--gold);letter-spacing:1px;}

  .hidden{display:none !important;}
  .mal{display:block;font-family:'Noto Sans Malayalam',sans-serif;font-size:14px;
    color:var(--muted);margin-top:3px;font-weight:400;line-height:1.45;}
  h2 .mal{font-size:15px;}
  .option-card .mal{font-size:13px;}

  .lang-switch{display:flex;justify-content:center;gap:8px;margin-top:14px;}
  .lang-switch button{padding:7px 16px;font-size:14px;background:transparent;
    border:1px solid var(--line);color:var(--muted);border-radius:999px;}
  .lang-switch button.active{border-color:var(--gold);color:var(--gold);}

  .admin-link{display:block;text-align:center;margin:34px 0 0;font-size:13px;color:#6E6355;
    text-decoration:underline;cursor:pointer;background:none;border:none;width:100%;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;
    align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal-box{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:24px 20px;max-width:380px;width:100%;}
  .modal-box h3{font-family:'Rozha One',serif;font-weight:400;color:var(--gold);margin:0 0 12px;font-size:21px;}

  .admin-wrap{max-width:780px;margin:0 auto;padding:20px 16px 60px;}
  .admin-header{display:flex;justify-content:space-between;align-items:center;gap:10px;
    flex-wrap:wrap;margin-bottom:16px;}
  .admin-header h2{font-family:'Rozha One',serif;font-weight:400;color:var(--gold);margin:0;font-size:23px;}
  .admin-stats{font-size:15px;color:var(--muted);}
  .admin-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .admin-toolbar input[type=text]{flex:1;min-width:160px;}
  .btn-gold{background:var(--gold);color:#12100E;white-space:nowrap;}
  .btn-outline{background:transparent;border:2px solid var(--line);color:var(--ink);white-space:nowrap;}
  .entry-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:15px 17px;margin-bottom:11px;}
  .entry-card .entry-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .entry-card .entry-name{font-weight:700;font-size:18px;}
  .entry-card .entry-ref{font-size:13px;color:var(--gold);font-family:'Rozha One',serif;}
  .entry-card .entry-meta{font-size:15px;color:var(--muted);margin-top:5px;}
  .entry-card .entry-meta b{color:var(--green);}
  .empty-state{text-align:center;color:var(--muted);padding:44px 10px;}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="appTitle">Kerala Classical &amp; Traditional Performing Arts Directory</h1>
  <p id="appSub">Stakeholder Enrollment · Agni Cultural Academy</p>
  <div class="motif"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

</div>

  <div class="card" id="cardArea"></div>
  <button class="admin-link" id="adminLinkBtn">Admin</button>
</div>

<div id="adminRoot"></div>

function t(key, ...args){
  const entry = STR[key];
  if(!entry) return key;
  const v = entry[lang || 'en'];
  return typeof v === 'function' ? v(...args) : v;
}
// Malayalam sub-label, shown under English when lang === 'ml'
function ml(key, ...args){
  if(lang !== 'ml') return '';
  const entry = STR[key];
  if(!entry) return '';
  const v = entry.en;
  const eng = typeof v === 'function' ? v(...args) : v;
  return `<span class="mal">${esc(eng)}</span>`;
}
function opt(v){
  if(lang !== 'ml') return v;
  return OPT_ML[v] ? `${OPT_ML[v]}` : v;
}
function optSub(v){
  if(lang !== 'ml' || !OPT_ML[v]) return '';
  return `<span class="mal">${esc(v)}</span>`;
}

  const cats = BUCKETS[bucket].categories;

  const list = OTHER_SPEC_CATEGORIES[bucket] || [];

// PhD question is hidden for Kathakali "Chutti" specialists and for the
// Krishnanattam / Ramanattam / Tholppavakoothu categories — these crafts
// don't have an associated doctoral research tradition.
function hidePhDQuestion(){
  const noPhdCategories = ["Krishnanattam","Ramanattam","Tholppavakoothu"];
  if(state.bucket === "Kerala Traditional Classical Art Forms" &&
     state.categories.some(c=>noPhdCategories.includes(c))) return true;
  if(state.specializations.includes("Chutti")) return true;
  return false;
}

const BUCKET_ORDER = Object.keys(BUCKETS);

// Returns the flat list of valid specialization options for the currently
// selected categories within a bucket. Handles both a flat array (same
// options regardless of category) and a per-category object.
function specOptionsFor(bucket, categories, who){
  let spec = BUCKETS[bucket].specializations;
  // Some buckets key specializations by role first (Artist/Teacher), since
  // the choices differ by who's enrolling, not just by category.
  if(spec && typeof spec === 'object' && !Array.isArray(spec) && spec[who] !== undefined){
    spec = spec[who];
  }
  if(Array.isArray(spec)) return spec;
  const set = new Set();
  categories.forEach(c=>{ (spec[c]||[]).forEach(s=>set.add(s)); });
  return [...set];
}

// ============ HELPERS ============
function esc(str){
  if(str === undefined || str === null) return "";
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---- Mobile number validation ----
// Normalizes to a bare 10-digit Indian mobile number (stripping +91/91/0
// prefixes and any spacing/punctuation), or returns null if it can't.
function normalizeIndianMobile(raw){
  let d = String(raw||'').replace(/\D/g,'');
  // Strip leading 0 and/or 91 country code, in either order/combination —
  // autofill sometimes produces both together (e.g. "0" + "91" + number).
  let changed = true;
  while(d.length > 10 && changed){
    changed = false;
    if(d.length - 2 >= 10 && d.startsWith('91')){ d = d.slice(2); changed = true; continue; }
    if(d.length - 1 >= 10 && d.startsWith('0')){ d = d.slice(1); changed = true; continue; }
  }
  return d.length===10 ? d : null;
}
function isObviouslyFakeNumber(d){
  if(/^(\d)\1{9}$/.test(d)) return true;        // all one digit, e.g. 9999999999
  if(/^(\d{2})\1{4}$/.test(d)) return true;      // repeating pair, e.g. 9898989898
  let asc=true, desc=true;
  for(let i=1;i<d.length;i++){
    const diff = d.charCodeAt(i)-d.charCodeAt(i-1);
    if(diff!==1) asc=false;
    if(diff!==-1) desc=false;
  }
  return asc || desc;                             // e.g. 0123456789 or 9876543210
}
function isValidIndianMobile(raw){
  const d = normalizeIndianMobile(raw);
  if(!d) return false;
  if(!/^[6-9]/.test(d)) return false;             // Indian mobiles start 6-9
  if(isObviouslyFakeNumber(d)) return false;
  return true;
}
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ""; }
function checked(id){ const el = document.getElementById(id); return el ? el.checked : false; }
function navHtml(nextKey){
  return `<div class="nav-buttons">
    ${stepIndex>0 ? `<button class="btn-secondary" id="backBtn">${esc(t('btnBack'))}</button>` : ''}
    <button class="btn-primary" id="nextBtn">${esc(t(nextKey||'btnContinue'))}</button>
  </div>`;
}
function wireNav(onNext, onBack, backDelta){
  const b = document.getElementById('backBtn');
  if(b) b.onclick = ()=>{ if(onBack) onBack(); go(-(backDelta||1)); };
  document.getElementById('nextBtn').onclick = onNext;
}
// How far Back should jump from the step right after "specialization" —
// 2 if that step was skipped forward (no specialization options existed
// for the chosen categories), otherwise the normal 1.
function backStepsAfterSpecialization(){
  return specOptionsFor(state.bucket, state.categories, state.who).length===0 ? 2 : 1;
}
function chipGroup(containerId, options, selectedArr, onChange){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  wrap.innerHTML = "";
  options.forEach(o=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedArr.includes(o) ? ' selected':'');
    chip.innerHTML = esc(opt(o));
    chip.onclick = ()=>{
      const i = selectedArr.indexOf(o);
      if(i>=0) selectedArr.splice(i,1); else selectedArr.push(o);
      onChange();
    };
    wrap.appendChild(chip);
  });
}
function showErr(id, msg){
  const e = document.getElementById(id);
  if(!e) return;
  if(msg) e.textContent = msg;
  e.classList.add('show');
}
function wireConditional(chkId, boxId){
  const c = document.getElementById(chkId);
  if(c) c.onchange = e=> document.getElementById(boxId).classList.toggle('show', e.target.checked);
}
function selectOptions(list, selected){
  return `<option value="">${esc(t('selectPrompt'))}</option>` +
    list.map(d=>`<option value="${esc(d)}" ${selected===d?'selected':''}>${esc(opt(d))}</option>`).join('');
}

// ============ REVIEW ============
function joinOpts(arr){ return arr.map(o=>opt(o)).join(", "); }

function summaryRows(){
  const R = [];
  R.push([t('rWho'), opt(state.who)]);
  R.push([t('rName'), state.name]);
  R.push([t('rMobile'), state.mobile]);
  R.push([t('rWhatsapp'), state.whatsapp]);
  R.push([t('rAddress'), state.address]);
  R.push([t('rPincode'), state.pincode]);
  R.push([t('rEmail'), state.email]);
  if(state.socialMedia) R.push([t('rSocial'), state.socialMedia]);
  if(state.bucket) R.push([t('rArtForm'), opt(state.bucket)]);
  if(state.categories.length) R.push([t('rCategory'), joinOpts(state.categories)]);
  if(state.specializations.length || state.specializationOther)
    R.push([t('rSpecialization'), [joinOpts(state.specializations), state.specializationOther].filter(Boolean).join(", ")]);
  if(state.designation) R.push([t('rDesignation'),
    state.designation==='Other' ? state.designationOther : opt(state.designation)]);
  if(state.designation==='Office Bearer' && state.officeBearerRole)
    R.push([t('rOfficeBearerRole'), state.officeBearerRole==='Other' ? state.officeBearerRoleOther : opt(state.officeBearerRole)]);
  if(state.teacherInstType) R.push([t('rTeacherInstType'), state.teacherInstType==='Govt./Govt.-aided' ? t('teacherInstTypeGovt') : t('teacherInstTypePrivate')]);
  if(state.instName) R.push([state.who==='Organization'?t('rOrganization'):t('rInstitution'), state.instName]);
  if(state.instAddress) R.push([t('rTheirAddress'), state.instAddress]);
  if(state.instEmail) R.push([t('rTheirEmail'), state.instEmail]);
  if(state.instPhone) R.push([t('rTheirPhone'), state.instPhone]);
  if(state.instMobile) R.push([t('rTheirMobile'), state.instMobile]);
  if(state.instWebsite) R.push([t('rWebsite'), state.instWebsite]);
  if(state.yearEstablished) R.push([t('rEstablished'), state.yearEstablished]);
  if(state.who==='Organization'){
    R.push([t('rIsRegistered'), state.isRegistered ? t('yes') : t('no')]);
    if(state.isRegistered){
      R.push([t('rRegType'), state.registrationType==='Other' ? state.registrationTypeOther : opt(state.registrationType)]);
      R.push([t('rRegAddress'), state.registeredAddress]);
    }
  }
  if(state.hasEventHall) R.push([t('rEventHall'), state.eventHallDetails || t('yes')]);
  if(state.subjectsTaught.length || state.subjectsTaughtOther)
    R.push([t('rSubjects'), [joinOpts(state.subjectsTaught), state.subjectsTaughtOther].filter(Boolean).join(", ")]);
  if(state.hasBranches) R.push([t('rBranches'),
    (state.branchCount||t('yes')) + (state.branchAddresses ? ' — '+state.branchAddresses : '')]);
  if(state.programTypes.length || state.programTypesOther)
    R.push([t('rPrograms'), [joinOpts(state.programTypes), state.programTypesOther].filter(Boolean).join(", ")]);
  if(state.programFrequency) R.push([t('rFrequency'), opt(state.programFrequency)]);
  if(state.festivals.length || state.festivalsOther)
    R.push([t('rFestivals'), [joinOpts(state.festivals), state.festivalsOther].filter(Boolean).join(", ")]);
  if(state.eduPrograms.length) R.push([t('rEduPrograms'), joinOpts(state.eduPrograms)]);
  if(state.teachesPrivateClasses) R.push([t('rTeachesPrivClasses'), joinOpts(state.teachesPrivateClassesModes) || t('yes')]);
  if(state.instrumentTypes.length) R.push([t('rInstrTypes'), joinOpts(state.instrumentTypes)]);
  if(state.leatherInstruments.length) R.push([t('rLeather'), joinOpts(state.leatherInstruments)]);
  if(state.stringInstruments.length) R.push([t('rString'), joinOpts(state.stringInstruments)]);
  if(state.windInstruments.length) R.push([t('rWind'), joinOpts(state.windInstruments)]);
  if(state.costumeInstruments.length) R.push([t('rCostume'), joinOpts(state.costumeInstruments)]);
  if(state.makerCategory) R.push([t('rMakerCategory'), opt(state.makerCategory)]);
  if(state.makerSpecializations.length) R.push([t('rMakerSpecialization'), joinOpts(state.makerSpecializations)]);
  if(state.yearsExperience) R.push([t('rYearsExp'), state.yearsExperience]);
  if(state.air) R.push([t('rAir'), state.air]);
  if(state.awards) R.push([t('rAwards'), state.awards]);
  if(state.books) R.push([t('rBooks'), state.books]);
  if(state.isPhdHolder){
    R.push([t('rIsPhd'), t('yes')]);
    R.push([t('rPhdThesis'), state.phdThesisTitle]);
    R.push([t('rPhdUniversity'), state.phdUniversity]);
    R.push([t('rPhdYear'), state.phdYear]);
  }
  if(state.teachesPrivately) R.push([t('rTeachPriv'), joinOpts(state.teachesPrivateClassesModes) || t('yes')]);
  if(state.runsPrivate) R.push([t('rRunsPriv'), state.runsPrivateDetails || t('yes')]);
  if(state.orgMember) R.push([t('rOrgMember'), state.orgMemberDetails || t('yes')]);
  return R;
}

  cardArea.innerHTML = `
    <h2>${esc(t('reviewTitle'))}${ml('reviewTitle')}</h2>
    <p class="sub">${esc(t('reviewSub'))}</p>
    <div id="summaryRows"></div>
    <div class="conditional show" style="margin-top:20px;">
      <div class="check-row" style="margin:0;">
        <input type="checkbox" id="fConsent" ${state.consent?'checked':''}>
        <label for="fConsent" style="font-weight:600;">${esc(t('consent'))}${ml('consent')}</label>
      </div>
      <p style="font-size:14px;color:var(--muted);margin:10px 0 0;">${esc(t('consentNote'))}</p>
    </div>
    <div class="error-text" id="submitError"></div>
    ${navHtml('btnSubmit')}
  `;
  const container = document.getElementById('summaryRows');
  summaryRows().forEach(([k,v])=>{
    const r = document.createElement('div');
    r.className = 'summary-row';
    r.innerHTML = `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>`;
    container.appendChild(r);
  });
  document.getElementById('backBtn').onclick = ()=>go(-1);
  document.getElementById('nextBtn').id = 'submitBtn';
  document.getElementById('submitBtn').onclick = ()=>{
    state.consent = checked('fConsent');
    if(!state.consent){ showErr('submitError', t('consentErr')); return; }
    document.getElementById('submitError').classList.remove('show');
    submitForm();
  };
}

// ============ SUBMIT ============
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function submitForm(){
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = t('btnSubmitting');
  const refId = 'KPAD-' + Date.now().toString(36).toUpperCase().slice(-6) + Math.floor(Math.random()*90+10);
  const entry = Object.assign({}, state, {refId, submittedAt:new Date().toISOString()});
  let lastErr = null;
  for(let attempt=1; attempt<=3; attempt++){
    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(entry)
      });
      try{
        const data = await res.json();
        if(data && data.success === false) throw new Error(data.error || 'server rejected');
      }catch(e){}
      if(!res.ok) throw new Error('HTTP ' + res.status);
      renderSuccess(refId);
      return;
    }catch(err){
      lastErr = err;
      if(attempt < 3){ await sleep(600*attempt); btn.textContent = t('btnRetry', attempt+1); }
    }
  }
  showErr('submitError', t('submitErr', (lastErr && lastErr.message) || 'unknown'));
  btn.disabled = false; btn.textContent = t('btnSubmit');
}

function renderSuccess(refId){
  const shareText = `The Kerala Classical & Traditional Performing Arts Directory, an initiative of Agni Cultural Academy, is the first project of its kind in the country to systematically document our classical and traditional performing arts community — artists, teachers, institutions, organizations and artisans alike.\n\nI have enrolled, and I would encourage you to do the same. It takes only a few minutes:\n${ENROLLMENT_LINK}`;
  const waLink = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
  progressBar.innerHTML = ''; stepLabel.textContent = '';
  cardArea.innerHTML = `
    <div class="success-icon">✓</div>
    <h2 style="text-align:center;">${esc(t('thankYou', state.name))}</h2>
    <p class="sub" style="text-align:center;">${esc(t('successMsg'))}</p>
    <div class="ref-box">
      <div style="font-size:14px;color:var(--muted);">${esc(t('refLabel'))}</div>
      <div class="refid">${esc(refId)}</div>
    </div>
    <p style="font-size:16px;color:var(--muted);text-align:center;">${esc(t('refNote'))}</p>
    <div class="nav-buttons">
      <a href="${waLink}" target="_blank" rel="noopener" class="btn-primary"
         style="display:flex;align-items:center;justify-content:center;text-decoration:none;background:var(--green);color:#0B0A09;">${esc(t('btnShare'))}</a>
    </div>
    <div class="nav-buttons">
      <button class="btn-secondary" id="anotherBtn" style="width:100%;">${esc(t('btnAnother'))}</button>
    </div>
  `;
  document.getElementById('anotherBtn').onclick = ()=>{
    const keepLang = state.language;
    state = blankState(); state.language = keepLang;
    stepIndex = 1; // skip language step, keep chosen language
    render(); window.scrollTo({top:0,behavior:'smooth'});
  };
}

// ============ ADMIN ============
let adminEntries = [];
document.getElementById('adminLinkBtn').onclick = openAdminLogin;

function openAdminLogin(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Admin Login</h3>
      <p style="font-size:15px;color:var(--muted);margin:0 0 14px;">Enter the admin password to view and export enrollments.</p>
      <input type="password" id="adminPwInput" placeholder="Password">
      <div class="error-text" id="pwError">Incorrect password.</div>
      <div class="nav-buttons">
        <button class="btn-secondary" id="pwCancel">Cancel</button>
        <button class="btn-primary" id="pwSubmit">Login</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('pwCancel').onclick = ()=> overlay.remove();
  document.getElementById('pwSubmit').onclick = ()=>{
    if(document.getElementById('adminPwInput').value === ADMIN_TOKEN){ overlay.remove(); showAdminPanel(); }
    else showErr('pwError');
  };
  document.getElementById('adminPwInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') document.getElementById('pwSubmit').click();
  });
}

async function showAdminPanel(){
  wrapEl.classList.add('hidden');
  adminRoot.innerHTML = `<div class="admin-wrap"><p style="text-align:center;color:var(--muted);">Loading enrollments...</p></div>`;
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?token=' + encodeURIComponent(ADMIN_TOKEN));
    const data = await res.json();
    if(!data || data.success === false) throw new Error((data && data.error) || 'Could not load');
    adminEntries = (data.entries||[]).slice().sort((a,b)=>
      String(b.submittedAt||'').localeCompare(String(a.submittedAt||'')));
    renderAdminPanel(adminEntries);
  }catch(err){
    adminRoot.innerHTML = `<div class="admin-wrap">
      <p style="text-align:center;color:var(--danger);">Could not load enrollments (${esc(err.message||'')}).</p>
      <div class="nav-buttons"><button class="btn-secondary" id="adminBackErr">Back</button></div></div>`;
    document.getElementById('adminBackErr').onclick = backToEnrollment;
  }
}

function listStr(v){ return Array.isArray(v) ? v.join(', ') : (v || ''); }

function renderAdminPanel(entries, filterText){
  filterText = (filterText||'').toLowerCase();
  const filtered = filterText ? entries.filter(e=>
    [e.name,e.who,e.bucket,e.instName,e.mobile,e.email,listStr(e.categories),listStr(e.specializations)]
      .join(' ').toLowerCase().includes(filterText)) : entries;
  adminRoot.innerHTML = `
    <div class="admin-wrap">
      <div class="admin-header">
        <h2>Enrollments</h2>
        <div class="admin-stats">${entries.length} total${filterText ? ` · ${filtered.length} shown` : ''}</div>
      </div>
      <div class="admin-toolbar">
        <input type="text" id="adminSearch" placeholder="Search by name, mobile, art form..." value="${esc(filterText)}">
        <button class="btn-gold" id="exportBtn">Export to Sheet (CSV)</button>
        <button class="btn-outline" id="refreshBtn">Refresh</button>
        <button class="btn-outline" id="logoutBtn">Log out</button>
      </div>
      <div id="entryList"></div>
    </div>`;
  const listEl = document.getElementById('entryList');
  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty-state">No enrollments${filterText?' match your search':' yet'}.</div>`;
  } else {
    filtered.forEach(e=>{
      const card = document.createElement('div');
      card.className = 'entry-card';
      const detail = listStr(e.categories) || listStr(e.programTypes) || listStr(e.instrumentTypes) || '';
      const spec = listStr(e.specializations);
      const waNum = normalizeIndianMobile(e.mobile);
      const waMsg = `Hi ${e.name||''}, this is Agni Cultural Academy. We're verifying your recent enrollment in the Kerala Classical & Traditional Performing Arts Directory. Could you please confirm your details?`;
      const waLink = waNum ? `https://wa.me/91${waNum}?text=${encodeURIComponent(waMsg)}` : null;
      card.innerHTML = `
        <div class="entry-top">
          <span class="entry-name">${esc(e.name)}</span>
          <span class="entry-ref">${esc(e.refId||'')}</span>
        </div>
        <div class="entry-meta"><b>${esc(e.who)}</b>${e.bucket?' · '+esc(e.bucket):''}${e.instName?' · '+esc(e.instName):''}</div>
        <div class="entry-meta">${esc(e.mobile)} · ${esc(e.email)}
          ${waLink ? ` · <a href="${waLink}" target="_blank" rel="noopener" style="color:var(--green);text-decoration:none;font-weight:600;">Verify on WhatsApp ↗</a>`
                   : ` · <span style="color:var(--danger);">⚠ invalid number format</span>`}
        </div>
        <div class="entry-meta">${esc(detail)}${spec?' — '+esc(spec):''}</div>
        <div class="entry-meta" style="font-size:13px;">${e.submittedAt?new Date(e.submittedAt).toLocaleString():''}</div>`;
      listEl.appendChild(card);
    });
  }
  document.getElementById('adminSearch').oninput = e=> renderAdminPanel(entries, e.target.value);
  document.getElementById('exportBtn').onclick = ()=> exportCSV(adminEntries);
  document.getElementById('refreshBtn').onclick = showAdminPanel;
  document.getElementById('logoutBtn').onclick = backToEnrollment;
}

function backToEnrollment(){ adminRoot.innerHTML = ''; wrapEl.classList.remove('hidden'); }

const EXPORT_COLS = [
  ['refId','Reference ID'],['submittedAt','Submitted At'],['language','Language'],['who','Enrolling As'],
  ['name','Name'],['mobile','Mobile'],['whatsapp','WhatsApp'],['address','Address'],
  ['pincode','Pincode'],['email','Email'],['socialMedia','Social Media'],
  ['bucket','Art Form Bucket'],['categories','Category'],['specializations','Specialization'],
  ['specializationOther','Specialization (Other)'],
  ['designation','Designation'],['designationOther','Designation (Other)'],
  ['officeBearerRole','Office Bearer Role'],['officeBearerRoleOther','Office Bearer Role (Other)'],
  ['teacherInstType','Teacher Institution Type'],
  ['teachesPrivateClasses','Also Teaches Private Classes'],['teachesPrivateClassesModes','Private Classes Mode'],
  ['instName','Institution/Organization Name'],['instAddress','Institution/Org Address'],
  ['instEmail','Institution/Org Email'],['instPhone','Institution Phone'],
  ['instMobile','Organization Mobile'],['instWebsite','Website'],
  ['yearEstablished','Year of Establishment'],
  ['isRegistered','Is Registered Body'],['registrationType','Registration Type'],
  ['registrationTypeOther','Registration Type (Other)'],['registeredAddress','Registered Address'],
  ['hasEventHall','Has Own Event Hall'],['eventHallDetails','Event Hall Details'],
  ['subjectsTaught','Subjects Taught'],['subjectsTaughtOther','Subjects Taught (Other)'],
  ['hasBranches','Has Branches'],['branchCount','No. of Branches'],['branchAddresses','Branch Addresses'],
  ['programTypes','Program Types'],['programTypesOther','Program Types (Other)'],
  ['programFrequency','Program Frequency'],['festivals','Festivals'],['festivalsOther','Festivals (Other)'],
  ['eduPrograms','Education Programs'],
  ['instrumentTypes','Instrument Types'],['leatherInstruments','Leather Instruments'],
  ['stringInstruments','String Instruments'],['windInstruments','Wind Instruments'],
  ['costumeInstruments','Costumes For'],
  ['makerCategory','Maker Category'],['makerSpecializations','Maker Specialization'],
  ['yearsExperience','Years of Experience'],
  ['isPhdHolder','PhD Holder'],['phdThesisTitle','PhD Thesis Title'],
  ['phdUniversity','PhD University'],['phdYear','PhD Year Conferred'],
  ['air','AIR/DD Grade'],['awards','Awards'],['books','Books Published / Other Details'],
  ['teachesPrivately','Teaches Private Classes (Artist)'],
  ['runsPrivate','Runs Private Institution'],['runsPrivateDetails','Private Institution Details'],
  ['worksAtInstitution','Works As Teacher At Institution (Artist)'],
  ['orgMember','Org Member/Office Bearer'],['orgMemberDetails','Organization Details'],
  ['consent','Consent to Publish']
];

function exportCSV(entries){
  const csvEsc = v=>{
    if(Array.isArray(v)) v = v.join('; ');
    if(v === undefined || v === null) v = '';
    if(typeof v === 'boolean') v = v ? 'Yes' : 'No';
    return `"${String(v).replace(/"/g,'""')}"`;
  };
  let csv = '\uFEFF' + EXPORT_COLS.map(c=>csvEsc(c[1])).join(',') + '\r\n';
  entries.forEach(e=>{ csv += EXPORT_COLS.map(c=>csvEsc(e[c[0]])).join(',') + '\r\n'; });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kerala-arts-directory-enrollments-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
</script>
